name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Module checksums are tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The ubuntu runner ships google-chrome-stable; wiring it in lets the
      # PDF smoke and ATS-regression tests actually run (they skip otherwise).
      # pdftotext is needed for the ATS text-extraction assertions.
      - name: Install pdftotext (poppler-utils)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Enable the PDF tests via the preinstalled Chrome
        run: |
          path=$(command -v google-chrome-stable || command -v google-chrome || true)
          if [ -n "$path" ]; then
            echo "TXTCV_BROWSER=$path" >> "$GITHUB_ENV"
          fi

      - name: Test
        run: go test -race -count=1 ./...
